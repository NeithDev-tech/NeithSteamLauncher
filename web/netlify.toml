[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"



[[redirects]]
  from = "/descargar"
  to = "/.netlify/functions/download-launcher"
  status = 200
  force = true

[[redirects]]
  from = "/api/geo"
  to = "/.netlify/functions/geo"
  status = 200

[[redirects]]
  from = "/api/analytics-id"
  to = "/.netlify/functions/analytics-id"
  status = 200
  force = true

[[redirects]]
  from = "/api/free-games"
  to = "/.netlify/functions/free-games"
  status = 200
  force = true

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
